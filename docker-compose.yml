# 后端这一侧的整套服务（Dokploy 的 Docker Compose 应用直接用这个文件；本机 docker compose up 也能跑）。
# 控制台（前端）是另一个独立部署的服务，见前端仓 README「部署」：它把 /api、/ws 转发到这里的 backend。
# 对外只需要给 backend 配域名（端口 8000）；其余服务只在 compose 内网里互相访问（expose，不映射到宿主机）。
# 变量从同目录 .env 读（Dokploy 的 Environment 页面写的就是它），清单见 .env.deploy.example。
# 数据库不在这个文件里：线上是 Dokploy 单独创建的 Postgres，DATABASE_URL 填它的 Internal Connection URL
# （Dokploy 给配了域名的 backend 同时挂 dokploy-network，那个主机名在上面可解析）。
# 本机跑没有 Dokploy 数据库：`docker compose --profile local-db up`，启动下面 local-db profile 里的 postgres。

x-server: &server
  build:
    context: .
  image: group-message-platform-server:latest
  restart: unless-stopped
  environment: &server-env
    NODE_ENV: production

services:
  # 只给本机用（--profile local-db）：不对外、口令固定，DATABASE_URL 写 postgresql://gmp:gmp@postgres:5432/gmp
  postgres:
    profiles: ["local-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gmp
      POSTGRES_PASSWORD: gmp
      POSTGRES_DB: gmp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmp -d gmp"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 消息网关模拟器（题目 2.1）：状态（账号、群、消息、事件历史）落盘在 gateway-data 卷里，重新部署不丢；
  # 要清空时与数据库一起重置，见 docs/deploy.md「重置数据」
  gateway-sim:
    <<: *server
    command: ["node", "dist/sim/gateway/main.js"]
    environment:
      <<: *server-env
      SIM_GATEWAY_PORT: "8100"
      SIM_GATEWAY_STATE_FILE: /data/gateway-sim.json
      # mediaUrl 的前缀要与 backend 的 GATEWAY_URL 同源（后端只下载网关自己的地址，题目 C1）
      SIM_GATEWAY_PUBLIC_URL: http://gateway-sim:8100
    volumes:
      - gateway-data:/data
    expose:
      - "8100"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8100/_sim/state"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Agent 服务模拟器（题目 2.2）：默认的 AGENT_URL 指向它
  agent-sim:
    <<: *server
    command: ["node", "dist/sim/agent/main.js"]
    environment:
      <<: *server-env
      SIM_AGENT_PORT: "8200"
    expose:
      - "8200"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8200/_sim/state"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 真实 LLM 版 Agent 服务（题目 C2）：把 AGENT_URL 设成 http://llm-agent:8300 即切过去；
  # 服务商 / API Key / 模型在控制台「模型设置」里填，存在 llm-data 卷里（不进镜像、不进 .env）
  llm-agent:
    <<: *server
    command: ["node", "dist/llm-agent/main.js"]
    environment:
      <<: *server-env
      LLM_AGENT_PORT: "8300"
      LLM_AGENT_ADMIN_TOKEN: ${LLM_AGENT_ADMIN_TOKEN:?在 .env 里设置 LLM_AGENT_ADMIN_TOKEN}
    volumes:
      - llm-data:/data
    expose:
      - "8300"

  # 后端 API + 全部 worker：启动时自己前滚迁移、跑幂等种子（预置 admin / viewer 与 acc-1…acc-5）。
  # 在 Dokploy 里给它配域名（端口 8000），前端的 BACKEND_URL 就填这个域名
  backend:
    <<: *server
    environment:
      <<: *server-env
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?在 .env 里设置 DATABASE_URL（Dokploy 数据库的 Internal Connection URL）}
      JWT_SECRET: ${JWT_SECRET:?在 .env 里设置 JWT_SECRET}
      GATEWAY_URL: http://gateway-sim:8100
      AGENT_URL: ${AGENT_URL:-http://agent-sim:8200}
      LLM_AGENT_ADMIN_TOKEN: ${LLM_AGENT_ADMIN_TOKEN}
      # 站点没配 HTTPS 时设成 0，否则浏览器不保存 refresh cookie（刷新页面会掉登录）
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      # 媒体文件（题目 C1）下载到 media-data 卷里：重新部署 / 换容器都还在
      MEDIA_DIR: /data/media
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-30}
      # 演示用：控制台群详情的「模拟外部发言」（经 gateway-sim 的 /_sim/push 推外部成员消息，可触发 Agent）
      SIM_CONTROLS_ENABLED: ${SIM_CONTROLS_ENABLED:-0}
    volumes:
      - media-data:/data
    expose:
      - "8000"
    depends_on:
      # 线上没有这个服务（库在 Dokploy 里），required: false 让它缺席时不报错；本机 --profile local-db 时照样等它健康
      postgres:
        condition: service_healthy
        required: false
      gateway-sim:
        condition: service_healthy
      agent-sim:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
  gateway-data:
  llm-data:
  media-data:
